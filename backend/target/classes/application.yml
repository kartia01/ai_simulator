spring:
  datasource:
    url: jdbc:postgresql://ep-spring-water-ao7rqigi.c-2.ap-southeast-1.aws.neon.tech/neondb?sslmode=require
    username: neondb_owner
    password: "npg_N6JQE9wnFLDI"
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      connection-timeout: 30000
      idle-timeout: 600000

  jpa:
    hibernate:
      ddl-auto: update              # 최초 실행 시 테이블 자동 생성
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  servlet:
    multipart:
      max-file-size: 55MB
      max-request-size: 60MB

  # Keep Spring Boot's default camelCase JSON for responses to React.
  # Snake_case ↔ camelCase for FastAPI payloads is handled per-DTO via @JsonProperty.
  jackson:
    default-property-inclusion: non_null

fastapi:
  base-url: ${FASTAPI_URL:http://localhost:8000}

frontend:
  origin: ${FRONTEND_ORIGIN:http://localhost:3000}

server:
  port: 8080

logging:
  level:
    com.adsimulator: INFO
    org.springframework.web.reactive.function.client: DEBUG
